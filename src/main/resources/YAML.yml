## YAML Template.
---
spring:
  application:
    name: secure-vault
  datasource:
    url: jdbc:h2:mem:securevault
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.securevault: DEBUG
    org.springframework.security: INFO